<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Montsoriu - Planificador</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f3;overflow:hidden}
    .bar{position:fixed;top:0;left:0;right:0;z-index:100;background:#fff;border-bottom:.5px solid rgba(0,0,0,.12);display:flex;align-items:center;padding:0 1.25rem;gap:4px;height:50px}
    .brand{font-size:13px;font-weight:500;color:#1a1a18;margin-right:1rem;padding-right:1rem;border-right:.5px solid rgba(0,0,0,.1);white-space:nowrap}
    .brand em{color:#1D9E75;font-style:normal}
    .tab{padding:.45rem 1rem;font-size:13px;cursor:pointer;border:none;background:none;font-family:inherit;color:#888780;border-radius:7px}
    .tab:hover{background:#f1efe8;color:#1a1a18}
    .tab.active{background:#E1F5EE;color:#085041;font-weight:500}
    .spacer{flex:1}
    .btn{font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;border-radius:8px;padding:.4rem 1rem;white-space:nowrap}
    #btn-save{background:#1D9E75;color:#fff}
    #btn-save:hover{background:#0F6E56}
    #btn-save.saving{background:#b4b2a9;pointer-events:none}
    #btn-save.ok{background:#E1F5EE;color:#085041;pointer-events:none}
    #btn-save.err{background:#FAEEDA;color:#633806;pointer-events:none}
    #btn-cfg{background:none;color:#888780;font-size:18px;padding:.3rem .6rem}
    #btn-cfg:hover{background:#f1efe8}
    .frames{position:fixed;top:50px;left:0;right:0;bottom:0}
    .fw{display:none;width:100%;height:100%}
    .fw.active{display:block}
    iframe{width:100%;height:100%;border:none;display:block}
    /* Modal */
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
    .overlay.open{display:flex}
    .modal{background:#fff;border-radius:16px;padding:1.5rem;width:min(480px,90vw);box-shadow:0 8px 40px rgba(0,0,0,.15)}
    .modal h2{font-size:17px;font-weight:500;margin-bottom:.25rem}
    .modal p{font-size:13px;color:#888780;margin-bottom:1.25rem;line-height:1.5}
    .field{margin-bottom:.85rem}
    .field label{display:block;font-size:12px;font-weight:500;color:#5f5e5a;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
    .field input{width:100%;padding:.5rem .75rem;border:.5px solid rgba(0,0,0,.15);border-radius:8px;font-size:13px;font-family:inherit;background:#fafaf8}
    .field input:focus{outline:none;border-color:#1D9E75}
    .field .hint{font-size:11px;color:#b4b2a9;margin-top:3px}
    .modal-btns{display:flex;gap:8px;margin-top:1.25rem;justify-content:flex-end}
    .btn-cancel{background:none;border:.5px solid rgba(0,0,0,.15);color:#888780;border-radius:8px;padding:.4rem 1rem;font-size:13px;font-family:inherit;cursor:pointer}
    .btn-ok{background:#1D9E75;color:#fff;border:none;border-radius:8px;padding:.4rem 1.25rem;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500}
    .status-dot{width:7px;height:7px;border-radius:50%;background:#b4b2a9;margin-right:6px;display:inline-block}
    .status-dot.ok{background:#1D9E75}
    .status-dot.err{background:#E24B4A}
  </style>
</head>
<body>
<div class="bar">
  <div class="brand">Montsoriu <em>&middot;</em> Rafa &amp; Bianca</div>
  <button class="tab active" data-tab="credito">Simulador credito</button>
  <button class="tab" data-tab="montsoriu">Escenario 2028</button>
  <button class="tab" data-tab="cronograma">Cronograma deuda</button>
  <div class="spacer"></div>
  <span id="sync-status" title="Estado de sincronizacion"><span class="status-dot" id="sdot"></span></span>
  <button class="btn" id="btn-save" onclick="doSave()">Guardar</button>
  <button class="btn" id="btn-cfg" onclick="openCfg()" title="Configuracion GitHub">&#9881;</button>
</div>

<div class="frames">
  <div class="fw active" id="wrap-credito"><iframe id="frame-credito"></iframe></div>
  <div class="fw" id="wrap-montsoriu"><iframe id="frame-montsoriu"></iframe></div>
  <div class="fw" id="wrap-cronograma"><iframe id="frame-cronograma"></iframe></div>
</div>

<!-- Config modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Configuracion GitHub</h2>
    <p>El estado se guarda en <code>state.json</code> en tu repositorio via GitHub API. Solo necesitas configurarlo una vez.</p>
    <div class="field">
      <label>Owner (usuario u organizacion)</label>
      <input id="cfg-owner" placeholder="trialrafael-sys">
    </div>
    <div class="field">
      <label>Repositorio</label>
      <input id="cfg-repo" placeholder="montsoriu">
    </div>
    <div class="field">
      <label>GitHub Token (classic, scope: repo)</label>
      <input id="cfg-token" type="password" placeholder="github_pat_...">
      <div class="hint">El token se guarda solo en este navegador (localStorage). Necesita permiso de escritura en el repo.</div>
    </div>
    <div class="field">
      <label>Rama</label>
      <input id="cfg-branch" placeholder="main">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeCfg()">Cancelar</button>
      <button class="btn-ok" onclick="saveCfg()">Guardar configuracion</button>
    </div>
  </div>
</div>

function b64d(b){const by=Uint8Array.from(atob(b),c=>c.charCodeAt(0));return new TextDecoder("utf-8").decode(by);}
Object.keys(B64).forEach(k=>{document.getElementById("frame-"+k).srcdoc=b64d(B64[k]);});

// ── Tabs ─────────────────────────────────────────────────────
let activeTab="credito";
document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    activeTab=btn.dataset.tab;
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.querySelectorAll(".fw").forEach(w=>w.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("wrap-"+activeTab).classList.add("active");
  });
});

// ── Config ────────────────────────────────────────────────────
function getCfg(){return JSON.parse(localStorage.getItem("mts_cfg")||"{}");}
function openCfg(){
  const c=getCfg();
  document.getElementById("cfg-owner").value=c.owner||"";
  document.getElementById("cfg-repo").value=c.repo||"";
  document.getElementById("cfg-token").value=c.token||"";
  document.getElementById("cfg-branch").value=c.branch||"main";
  document.getElementById("overlay").classList.add("open");
}
function closeCfg(){document.getElementById("overlay").classList.remove("open");}
function saveCfg(){
  localStorage.setItem("mts_cfg",JSON.stringify({
    owner:document.getElementById("cfg-owner").value.trim(),
    repo:document.getElementById("cfg-repo").value.trim(),
    token:document.getElementById("cfg-token").value.trim(),
    branch:document.getElementById("cfg-branch").value.trim()||"main"
  }));
  closeCfg();
}
document.getElementById("overlay").addEventListener("click",e=>{if(e.target===e.currentTarget)closeCfg();});

// ── postMessage: cargar estado desde state.json ───────────────
let _loadedState = null;

async function fetchState(){
  try{
    const r=await fetch("state.json?t="+Date.now());
    if(r.ok){_loadedState=await r.json();setDot("ok");}
  }catch(e){setDot("err");}
}

function setDot(s){
  const d=document.getElementById("sdot");
  d.className="status-dot"+(s?" "+s:"");
  d.title=s==="ok"?"Conectado - estado cargado":s==="err"?"No se pudo cargar state.json":"";
}

window.addEventListener("message",e=>{
  if(!e.data||typeof e.data!=="object")return;
  if(e.data.action==="requestState"){
    ["credito","montsoriu","cronograma"].forEach(k=>{
      const fr=document.getElementById("frame-"+k);
      if(fr&&e.source===fr.contentWindow){
        const st=_loadedState&&_loadedState[k]?_loadedState[k]:null;
        fr.contentWindow.postMessage({action:"loadState",state:st},"*");
      }
    });
  }
  if(e.data.action==="stateResponse"){
    const k=e.data._tool;
    if(k&&_pending[k]){_pending[k](e.data.state);delete _pending[k];}
  }
});

// ── Recoger estado de los iframes ─────────────────────────────
const _pending={};
function _getState(k){
  return new Promise(res=>{
    _pending[k]=res;
    document.getElementById("frame-"+k).contentWindow.postMessage({action:"getState",_tool:k},"*");
    setTimeout(()=>{if(_pending[k]){_pending[k](null);delete _pending[k];}},4000);
  });
}

// ── GitHub API save ───────────────────────────────────────────
async function ghSave(states){
  const c=getCfg();
  if(!c.owner||!c.repo||!c.token) throw new Error("Configura GitHub primero (boton engranaje)");

  const path="state.json";
  const api=`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`;
  const headers={"Authorization":"token "+c.token,"Content-Type":"application/json"};

  // Obtener SHA actual (si existe)
  let sha=null;
  try{
    const r=await fetch(api,{headers});
    if(r.ok){const d=await r.json();sha=d.sha;}
  }catch(e){}

  const content=btoa(unescape(encodeURIComponent(JSON.stringify(states,null,2))));
  const body={message:"Guardar estado Montsoriu",content,branch:c.branch||"main"};
  if(sha) body.sha=sha;

  const r=await fetch(api,{method:"PUT",headers,body:JSON.stringify(body)});
  if(!r.ok){const t=await r.text();throw new Error("GitHub API: "+r.status+" "+t.substring(0,120));}
}

// ── Boton Guardar ─────────────────────────────────────────────
async function doSave(){
  const c=getCfg();
  if(!c.token){openCfg();return;}

  const btn=document.getElementById("btn-save");
  btn.textContent="Guardando...";btn.className="btn saving";

  try{
    const [sc,sm,sk]=await Promise.all([_getState("credito"),_getState("montsoriu"),_getState("cronograma")]);
    await ghSave({credito:sc,montsoriu:sm,cronograma:sk});
    _loadedState={credito:sc,montsoriu:sm,cronograma:sk};
    btn.textContent="&#10003; Guardado";btn.className="btn ok";
    setDot("ok");
    setTimeout(()=>{btn.textContent="Guardar";btn.className="btn";btn.id="btn-save";},3000);
  }catch(err){
    btn.textContent="Error: "+err.message.substring(0,40);btn.className="btn err";
    setTimeout(()=>{btn.textContent="Guardar";btn.className="btn";btn.id="btn-save";},5000);
  }
}

// ── Arranque ──────────────────────────────────────────────────
fetchState();
